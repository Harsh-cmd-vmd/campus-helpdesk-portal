apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-helpdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-helpdesk
  template:
    metadata:
      labels:
        app: campus-helpdesk
    spec:
      containers:
        - name: campus-helpdesk
          image: DOCKERHUB_USERNAME/campus-helpdesk:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
